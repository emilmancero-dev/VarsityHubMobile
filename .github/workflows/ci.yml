name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

# CI gates: All checks must pass before merge
# - Repo health: Ensures no logs/artifacts committed
# - Lint: Code quality
# - Typecheck: Type safety

jobs:
  repo-health:
    name: Repo Health
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Repo health check
        run: ./scripts/check-repo-health.sh

  cache-invalidation-guard:
    name: Cache Invalidation Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check new raw user mutations
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi

          GIT_BASE_SHA="$BASE_SHA" GIT_HEAD_SHA="HEAD" npm run verify:user-cache

  route-guardrails:
    name: Route Guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check matrix inventory drift and evidence
        run: |
          node --test scripts/__tests__/release-workflow-ordering.test.cjs
          node --test scripts/__tests__/matrix-inventory.test.cjs
          npm run audit:matrix:inventory

      - name: Check async handler and error envelope usage
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi

          GIT_BASE_SHA="$BASE_SHA" GIT_HEAD_SHA="HEAD" npm run verify:async-handlers
          GIT_BASE_SHA="$BASE_SHA" GIT_HEAD_SHA="HEAD" npm run verify:error-envelope

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npm run typecheck

  web-export-warning-guard:
    name: Web Export Warning Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check web export console output
        run: npm run web:export:check

  server-checks:
    name: Server TypeScript & Prisma
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Validate Prisma schema
        working-directory: server
        run: npx prisma validate
        env:
          DATABASE_URL: 'postgresql://dummy:dummy@localhost:5432/dummy'

      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate
        env:
          DATABASE_URL: 'postgresql://dummy:dummy@localhost:5432/dummy'

      - name: TypeScript check (server)
        working-directory: server
        run: npx tsc --noEmit --skipLibCheck

      # Full server build — catches regressions that tsc alone misses
      # (file copies in the build chain, missing dist outputs, etc.).
      # Railway runs this exact command at deploy time; if it fails here,
      # the deploy would fail there. Pre-deploy catch.
      - name: Server build
        working-directory: server
        run: npm run build
        env:
          DATABASE_URL: 'postgresql://dummy:dummy@localhost:5432/dummy'

  server-invariants:
    name: Server Invariants
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: varsityhub_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d varsityhub_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/varsityhub_test
      JWT_SECRET: test-jwt-secret-with-at-least-32-chars
      SENDGRID_API_KEY: test-sendgrid-key
      ADMIN_EMAILS: admin@example.com
      CLOUDINARY_CLOUD_NAME: test
      CLOUDINARY_API_KEY: test
      CLOUDINARY_API_SECRET: test
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_dummy
      APPLE_IAP_SHARED_SECRET: test-apple-secret
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Apply Prisma schema
        working-directory: server
        run: npx prisma migrate deploy

      - name: Run approval, OAuth, and session invariants
        working-directory: server
        run: npm run test:invariants
  server-tests:
    name: Server Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: varsityhub_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d varsityhub_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/varsityhub_test
      JWT_SECRET: test-jwt-secret-with-at-least-32-chars
      SENDGRID_API_KEY: test-sendgrid-key
      ADMIN_EMAILS: admin@example.com
      CLOUDINARY_CLOUD_NAME: test
      CLOUDINARY_API_KEY: test
      CLOUDINARY_API_SECRET: test
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_dummy
      APPLE_IAP_SHARED_SECRET: test-apple-secret
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Apply Prisma schema
        working-directory: server
        run: npx prisma migrate deploy

      - name: Install isolated Redis test prerequisite
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server

      - name: Run server tests
        working-directory: server
        # Invoke the wrapper by direct path so the inner `npm test`
        # resolves against server/package.json (and finds server's
        # local jest binary). `npm --prefix .. run ci:retry` would
        # switch cwd to root for the whole chain, breaking jest
        # resolution because jest is only installed under server/.
        # Do NOT add `--runInBand` here. It forces every suite into the same
        # Jest process and triggers Node's "module is already linked" failure
        # across ~40 ESM suites that dynamic-import overlapping modules.
        # jest.config.js sets maxWorkers: 2 which keeps Postgres connection
        # pressure bounded without the cross-suite collision.
        run: node ../scripts/run-with-retry.js 2 npm test

      - name: Verify local runtime test isolation
        run: node --test scripts/__tests__/org-manager-verifier-isolation.test.cjs

  # All checks must pass - this job ensures the PR gate
  all-checks:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs:
      [
        repo-health,
        cache-invalidation-guard,
        route-guardrails,
        lint,
        typecheck,
        web-export-warning-guard,
        server-checks,
        server-invariants,
        server-tests,
        test,
        format-check,
        dependency-audit,
      ]
    if: always()
    steps:
      - name: Verify all checks passed
        run: |
          if [ "${{ needs.repo-health.result }}" != "success" ] || \
             [ "${{ needs.cache-invalidation-guard.result }}" != "success" ] || \
             [ "${{ needs.route-guardrails.result }}" != "success" ] || \
             [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.typecheck.result }}" != "success" ] || \
             [ "${{ needs.web-export-warning-guard.result }}" != "success" ] || \
             [ "${{ needs.server-checks.result }}" != "success" ] || \
             [ "${{ needs.server-invariants.result }}" != "success" ] || \
             [ "${{ needs.server-tests.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.format-check.result }}" != "success" ] || \
             [ "${{ needs.dependency-audit.result }}" != "success" ]; then
            echo "❌ One or more checks failed"
            exit 1
          fi
          echo "✅ All checks passed"

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Threshold: high+critical fail the build; moderate is surfaced in the
      # dedicated Snyk Security Scanning workflow + npm-audit.yml nightly,
      # which are where we triage and remediate. Blocking every PR on a
      # moderate transitive dep makes the gate too noisy and encourages
      # --no-verify bypasses, which is worse than deliberate triage.
      - name: Audit frontend dependencies
        run: |
          # npm audit currently reports GHSA-w3rx-r6r6-pgpr / GHSA-5p2g-fcmc-qvqq
          # through Expo/Metro transitive deps, and npm marks image-size <=2.0.2
          # as vulnerable with no non-breaking remediation path. Keep the check
          # strict for everything else: fail on any non-allowlisted high/critical.
          npm audit --json > audit-root.json || true
          node -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync("audit-root.json", "utf8"));
            const vulns = report.vulnerabilities || {};
            const allowPackages = new Set([
              "image-size",
              "metro",
              "metro-config",
              "metro-transform-worker",
              "@expo/metro",
              "@expo/metro-config",
              "@expo/cli",
              "expo",
              "@react-native/community-cli-plugin",
              "react-native",
            ]);
            const allowGhsa = new Set(["GHSA-w3rx-r6r6-pgpr", "GHSA-5p2g-fcmc-qvqq"]);
            const isHighOrCritical = (s) => s === "high" || s === "critical";
            const disallowed = [];

            for (const [pkg, vuln] of Object.entries(vulns)) {
              if (!isHighOrCritical(vuln.severity)) continue;
              if (!allowPackages.has(pkg)) {
                disallowed.push(`${pkg} (${vuln.severity})`);
                continue;
              }
              const via = Array.isArray(vuln.via) ? vuln.via : [];
              const hasUnknownVia = via.some((entry) => {
                if (typeof entry === "string") return !allowPackages.has(entry);
                if (!entry || typeof entry !== "object") return true;
                if (!isHighOrCritical(entry.severity)) return false;
                const ghsa = (entry.url || "").match(/GHSA-[^/]+/)?.[0] || "";
                return !allowGhsa.has(ghsa);
              });
              if (hasUnknownVia) disallowed.push(`${pkg} (${vuln.severity})`);
            }

            if (disallowed.length > 0) {
              console.error("Disallowed high/critical frontend vulnerabilities:");
              for (const item of disallowed) console.error(` - ${item}`);
              process.exit(1);
            }

            console.log("Only allowlisted Expo/Metro image-size advisories present.");
          '

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Audit server dependencies
        working-directory: server
        run: npm audit --audit-level=high

  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting on changed files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi

          if [ -z "$BASE_SHA" ]; then
            echo "No base SHA available; skipping format diff check"
            exit 0
          fi

          # --diff-filter=d excludes deleted paths so prettier --check is not
          # handed files that no longer exist (a deletion PR would otherwise
          # fail here with "No files matching the pattern").
          CHANGED_FILES="$(git diff --name-only --diff-filter=d "$BASE_SHA" HEAD -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.json' '*.md')"
          if [ -z "$CHANGED_FILES" ]; then
            echo "No format-relevant files changed"
            exit 0
          fi

          echo "Checking formatting for:"
          echo "$CHANGED_FILES"
          echo "$CHANGED_FILES" | xargs npx prettier --check

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run ci:retry -- 2 npm test
