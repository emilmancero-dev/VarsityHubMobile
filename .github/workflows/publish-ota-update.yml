name: Publish Production OTA Update

# Explicit release stage: dispatch only after candidate CI and backend runtime
# verification pass. Never race a main push against the API deployment.
# Requires an EXPO_TOKEN repo secret (Settings >
# Secrets and variables > Actions); if it's missing, this workflow logs a
# failure instead of silently publishing no update. Requires SENTRY_AUTH_TOKEN
# so Sentry source maps upload with the production OTA bundle.
#
# This does NOT touch the native binary — no eas build/submit here (see
# CLAUDE.md: "Never run eas build or eas submit"). Users still need to
# reopen the app twice after a publish for expo-updates to apply it
# (fallbackToCacheTimeout: 0 — downloads on open #1, applies on open #2).

on:
  workflow_dispatch:
    inputs:
      runtime:
        description: 'Native-compatible runtime reviewed for this release'
        type: choice
        required: true
        default: '1.0.6'
        options: ['1.0.6', '1.0.5']

concurrency:
  group: production-ota
  cancel-in-progress: false

jobs:
  publish:
    name: eas update --branch production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Check publish secrets are configured
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          missing=0
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN repo secret is not set. Add it under Settings > Secrets and variables > Actions to enable production OTA publishing."
            missing=1
          fi
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::error::SENTRY_AUTH_TOKEN repo secret is not set. Add it so Sentry source maps upload during production OTA publishing."
            missing=1
          fi
          exit "$missing"

      - name: Install app dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Publish OTA update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: npm run update:production -- --runtime ${{ inputs.runtime }}
