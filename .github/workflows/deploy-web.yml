name: Deploy Web to Vercel

# Explicit release stage after candidate CI and backend runtime verification.
# Confirm Vercel is still the intended host before dispatch. Its Git integration can't be
# used directly here: it auto-detects the api/ directory as serverless
# functions and fails on the server's TypeScript build (see
# scripts/deploy-web-static.sh, which builds a clean api/-free deploy dir
# instead). Requires a VERCEL_TOKEN repo secret (Settings > Secrets and
# variables > Actions). The deploy also verifies that the Vercel project does
# not contain server-only Railway secrets before building the public web bundle.

on:
  workflow_dispatch: {}

concurrency:
  group: production-web
  cancel-in-progress: false

jobs:
  deploy:
    name: web:deploy:prod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Check Vercel config is present
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
        run: |
          missing=0
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN repo secret is not set. Add it under Settings > Secrets and variables > Actions to enable web deploy."
            missing=1
          fi
          if [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::VERCEL_PROJECT_ID repo variable is not set."
            missing=1
          fi
          if [ -z "$VERCEL_ORG_ID" ]; then
            echo "::error::VERCEL_ORG_ID repo variable is not set."
            missing=1
          fi
          exit "$missing"

      - name: Install dependencies
        run: npm ci

      - name: Link Vercel project
        # .vercel/project.json is gitignored (deploy-web-static.sh requires it
        # to exist), so it's synthesized here from repo vars instead of being
        # committed to a public repo.
        run: |
          mkdir -p .vercel
          echo '{"projectId":"${{ vars.VERCEL_PROJECT_ID }}","orgId":"${{ vars.VERCEL_ORG_ID }}","projectName":"varsityhub-web"}' > .vercel/project.json

      - name: Verify Vercel production env drift
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npm run verify:vercel-env-drift

      - name: Pull Vercel production env for web export
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel env pull .env.local --environment=production --yes

      - name: Deploy web to Vercel production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        # EXPO_PUBLIC_* values must be present before `expo export`, because
        # they are baked into the static web bundle. The previous workflow only
        # injected Sentry; `.env.local` now comes from the cleaned Vercel
        # production env after the drift guard passes.
        run: npm run web:deploy:prod
