name: Security architecture audit
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: architecture-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/audit/package-lock.json
      - name: Install isolated audit dependencies
        run: npm ci --prefix tools/audit --ignore-scripts
      - name: Test checklist and audit runner
        run: npm --prefix tools/audit test
      - name: Typecheck and build checklist
        run: npm --prefix tools/audit run build
      - name: Install browser for acceptance checks
        run: tools/audit/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify reviewer browser workflows
        run: npm --prefix tools/audit run test:ui
      - name: Run source audit
        id: audit
        run: tools/audit/node_modules/.bin/tsx scripts/audit-check.ts
      - name: Publish report summary
        if: always()
        run: |
          if test -f /tmp/audit-report.md; then
            cat /tmp/audit-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Audit report unavailable: inspect failed setup/test/runner step. No passing status inferred.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload reviewer artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-architecture-audit
          path: |
            /tmp/audit-report.json
            /tmp/audit-report.md
          if-no-files-found: warn
      # Never use pull_request_target to execute PR code. Fork PRs retain the
      # read-only token and receive the report via artifacts / job summary.
      - name: Update same-repository PR report
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- security-architecture-audit -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const report = fs.existsSync('/tmp/audit-report.md') ? fs.readFileSync('/tmp/audit-report.md', 'utf8') : 'Audit report unavailable; check setup, tests and runner logs. This is not a passing audit.';
            const body = `${marker}\n[View audit run and complete artifacts](${runUrl})\n\n${report.slice(0, 55000)}`;
            const comments = await github.paginate(github.rest.issues.listComments, {...context.repo, issue_number: context.issue.number});
            const previous = comments.find(c => c.user?.login === 'github-actions[bot]' && c.body?.startsWith(marker));
            if (previous) await github.rest.issues.updateComment({...context.repo, comment_id: previous.id, body});
            else await github.rest.issues.createComment({...context.repo, issue_number: context.issue.number, body});
